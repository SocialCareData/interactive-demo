# Guided journeys: one story per person. Riley's is the one to present.
#
# Each story walks a person's whole timeline, one entry per step, in date order. The story bar shows
# the timeline, and the link on the page that leads to the next step (a "Followed up by" link, the
# other system's view) is marked "Next". Most steps ask the viewer to select the link back to the
# record before it, so the chain from one record to the next is something they do, not just read.
#
#   route   the page: #/person/<id>, #/record/<kind>/<id>, #/system/camhs/<id>, #/map, #/gaps
#   label   a word or two for the timeline in the story bar (defaults to the title)
#   view    screen | split | data            (default split; keep it split unless there's a reason)
#   tab     data | explained | map           (back pane tab; default data)
#   xray    true to label values with their field names
#   task    something for the viewer to do: select the value at `trace`. "Show me" (or →) does it.
#   trace   JSON pointer to the value, in the page's record (or give record: <@id>)
#           Without a task, the value is simply highlighted.
#   gap     an open question to link from the bar (it stays closed until the viewer opens it)
#   title, text   what to notice: two or three plain sentences
# Pages open at the top: a step never scrolls the screen for the viewer.
# validate.py checks every route, record, path and question here.

- id: riley
  title: Riley's story
  start: Riley Hart, 9
  minutes: 12
  summary: A school worries about neglect. An assessment, a Child in Need plan, and a request to CAMHS that is redirected.
  steps:
    - title: Meet Riley
      label: Riley
      route: "#/person/P-100231"
      text: >
        Riley is 9. He lives with his mum, Dawn, and his sister, Mia, who is 4. You can explore his details and his
        timeline. This story follows it, one entry at a time.

    - title: The school's referral
      label: Referral
      route: "#/record/referral/REF-2026-0412"
      task: Select the school's description of the concern.
      trace: /concern/0/description
      text: >
        In September, the school's safeguarding lead refers Riley: he's hungry most mornings, often absent,
        and was left at school late. The referral keeps the school's own words. The school didn't give an
        NHS number, so the front door matched Riley to his record when it triaged the referral.

    - title: Acknowledged
      label: Response
      route: "#/record/response/RES-2026-0870"
      task: Select what this responds to.
      trace: /respondsTo
      text: >
        The next day, the front door acknowledges the referral. A response always points back at what it
        responds to, by its identifier, so the school's system can match it to the referral it sent.

    - title: The front door looks into it
      label: MASH review
      route: "#/record/episode/EP-2026-0088"
      task: Select the findings.
      trace: /finding
      gap: G6
      text: >
        The front door reviews the referral with police and health colleagues. The checks bring to light a
        visit to A&E in July, when Riley burnt his hand: the hospital shared it using his NHS number, so it's
        already in his timeline. The review's findings are shared as text.

    - title: A request for an assessment
      label: Request
      route: "#/record/request/REQ-2026-0233"
      task: Select the referral this follows up.
      trace: /linkedRecord/0
      text: >
        The review decides Riley needs a child and family assessment. The front door asks the Assessment and
        Intervention Team for one. The request follows up the referral, so anyone reading it can see why.

    - title: Accepted
      label: Response
      route: "#/record/response/RES-2026-0871"
      task: Select what this is responding to.
      trace: /respondsTo
      text: >
        The front door tells the school the referral is accepted. The response points back at the referral
        it's responding to, and also links to the request it led to.

    - title: The assessment
      label: Assessment
      route: "#/record/episode/EP-2026-0095"
      task: Select the professional involved.
      trace: /relatedProfessional
      gap: G5
      text: >
        Riley's social worker assesses the family over a month. The episode names the professionals and
        services involved, and findings such as persistent absence are shared as coded observations.

    - title: Back to Riley's record
      label: Riley
      route: "#/person/P-100231"
      text: >
        It's now late October, two months after the school's referral. Riley's timeline runs from his A&E
        visit in July, through the referral, the review and the request, to the assessment. Next comes his
        plan.

    - title: A Child in Need plan
      label: CIN plan
      route: "#/record/episode/EP-2026-0117"
      task: Select how often the social worker visits.
      trace: /timeInformation/0/frequency
      gap: G1
      text: >
        The assessment recommends a Child in Need plan. It starts on 27 October, with a visit every two weeks,
        and is still open. The plan itself, its goals and actions, stays in the council's system.

    - title: A visit
      label: Visit
      route: "#/record/episode/EP-2026-0121"
      task: Select the episode type.
      trace: /type/0
      text: >
        On 3 November, Riley's social worker visits the family at home, as his plan sets out. Each visit can be
        shared as an episode of face-to-face contact. Riley has been refusing school and can't sleep.

    - title: A request to CAMHS
      label: To CAMHS
      route: "#/record/request/REQ-2026-0301"
      task: Select who the request is about.
      trace: /subject
      text: >
        That afternoon, his social worker asks CAMHS for help. The
        request names Riley by his NHS number, so CAMHS can find him in its own system.

    - title: The same request at CAMHS
      label: At CAMHS
      route: "#/system/camhs/REQ-2026-0301"
      task: Select the NHS number.
      trace: /subject/value
      text: >
        CAMHS's own system shows the same request differently. The record on the right is identical: only the
        screen differs.

    - title: CAMHS acknowledges
      label: Response
      route: "#/record/response/RES-2026-1022"
      task: Select what this responds to.
      trace: /respondsTo
      text: >
        Two days later, CAMHS replies. Its response comes back to the council's system and points at the
        council's request, so it lands in the right place in Riley's timeline.

    - title: Redirected
      label: Response
      route: "#/record/response/RES-2026-1104"
      task: Select the link to the new referral.
      trace: /linkedRecord/0
      text: >
        CAMHS decides the School Mental Health Support Team is the right service. Its response links to the
        new referral, which is held by the NHS trust rather than the council. This is the latest entry in
        Riley's timeline.

- id: margaret
  title: Margaret's story
  start: Margaret Ellis, 82
  summary: A Care Act assessment and care plan at home, then a safeguarding referral and a concern about her care.
  steps:
    - title: Meet Margaret
      label: Margaret
      route: "#/person/P-100457"
      text: >
        Margaret is 82, lives alone and has Parkinson's disease. Her daughter Sarah lives 40 minutes away.
        Below her details is her timeline, which this story follows one entry at a time.

    - title: Sarah asks for help
      label: Referral
      route: "#/record/referral/REF-2026-0365"
      task: Select Sarah's description.
      trace: /concern/0/description
      text: >
        In August, Sarah asks the council for a Care Act assessment. In her own words, her mum has been
        struggling to manage at home since a fall in July.

    - title: Accepted
      label: Response
      route: "#/record/response/RES-2026-0702"
      task: Select what this responds to.
      trace: /respondsTo
      text: >
        The adult front door accepts the referral the next day. The response points back at it by identifier.

    - title: The assessment
      label: Assessment
      route: "#/record/episode/EP-2026-0071"
      task: Select the referral this follows up.
      trace: /linkedRecord/0
      text: >
        A social worker assesses Margaret at home over two weeks. The assessment follows up Sarah's referral.
        Findings such as having an unpaid carer and a risk of falls are shared as coded observations.

    - title: Questions with national IDs
      label: Questions
      route: "#/record/assessment/CNA-2026-0031"
      task: Select a national question ID.
      trace: /assessmentQuestion/6/questionId
      gap: G11
      text: >
        The assessment's questions and answers are a record of their own. The questions carry national IDs,
        so every system asks and reads them the same way.

    - title: A care plan begins
      label: Plan starts
      route: "#/record/episode/EP-2026-0080"
      task: Select the assessment this follows up.
      trace: /linkedRecord/0
      text: >
        From 1 September, Margaret has a care plan. The episode marks the period of the plan, and follows up
        the assessment.

    - title: The care plan
      label: Care plan
      route: "#/record/plan/PLAN-2026-0027"
      task: Select the outcome the first visit meets.
      trace: /careComponent/0/activity/outcome
      gap: G16
      text: >
        Carers four times a day, Sarah on Sundays, a pendant alarm. Each part of the plan names who does it,
        when, and the Care Act outcome it meets.

    - title: Care at home
      label: Home care
      route: "#/record/episode/EP-2026-0083"
      task: Select how often the carers visit.
      trace: /timeInformation/0/frequency
      text: >
        The home care itself is an episode of direct provision, following up the plan, with its frequency
        recorded: four visits a day.

    - title: A district nurse's referral
      label: Referral
      route: "#/record/referral/REF-2026-0561"
      task: Select the nurse's description.
      trace: /concern/0/description
      gap: G10
      text: >
        In November, the district nurse finds a pressure ulcer, missed evening medication and late or missed
        calls. She refers Margaret for safeguarding, giving her NHS number.

    - title: Acknowledged
      label: Response
      route: "#/record/response/RES-2026-1187"
      task: Select what this responds to.
      trace: /respondsTo
      text: >
        The adult front door acknowledges the nurse's referral and passes it to the safeguarding team.

    - title: A request for an enquiry
      label: Request
      route: "#/record/request/REQ-2026-0341"
      task: Select the referral this follows up.
      trace: /linkedRecord/0
      text: >
        The front door asks the Adult Safeguarding Team to make a section 42 enquiry. The request follows up
        the nurse's referral.

    - title: Sarah's concern
      label: Sarah's concern
      route: "#/record/qoc/QOC-2026-0019"
      task: Select the link to the nurse's referral.
      trace: /linkedRecord/0
      text: >
        The same day, Sarah raises a concern about the care provider with the council and the regulator. It's
        linked to the nurse's referral as concurrent, and its type is still to be assigned at triage.

    - title: The enquiry opens
      label: Enquiry
      route: "#/record/episode/EP-2026-0136"
      task: Select the request this follows up.
      trace: /linkedRecord/0
      text: >
        Today, the adult safeguarding team opens a section 42 enquiry. It follows up the front door's request,
        and it's the last entry in Margaret's timeline.

- id: jordan
  title: Jordan's story
  start: Jordan Pike, 15
  summary: Early Help, three missing episodes, a police referral about exploitation, and a section 47 enquiry.
  steps:
    - title: Meet Jordan
      label: Jordan
      route: "#/person/P-100311"
      text: >
        Jordan is 15 and lives with his mum, Carla. Below his details is his timeline, which this story
        follows one entry at a time.

    - title: An Early Help plan
      label: Early Help
      route: "#/record/episode/EP-2026-0061"
      task: Select the episode type.
      trace: /type/0
      gap: G5
      text: >
        Since June, Jordan and Carla have had support from Early Help. The plan is an episode, with his school
        and the Family Hub involved.

    - title: Missing for the first time
      label: Missing
      route: "#/record/life-event/LE-2026-0140"
      task: Select the location.
      trace: /location/0
      text: >
        In September, Jordan goes missing for an evening. Each time he goes missing is a life event, with
        when it started and ended, and where.

    - title: Missing again
      label: Missing
      route: "#/record/life-event/LE-2026-0187"
      task: Select when he went missing.
      trace: /timeInformation/0/startDateTime
      text: >
        In October, he goes missing again, for nearly six hours.

    - title: Missing overnight
      label: Overnight
      route: "#/record/life-event/LE-2026-0231"
      task: Select when he went missing.
      trace: /timeInformation/0/startDateTime
      gap: G14
      text: >
        On 7 November, he's away overnight for the first time.

    - title: The police refer
      label: Referral
      route: "#/record/referral/REF-2026-0518"
      task: Select the concern type.
      trace: /concern/0/concernType
      text: >
        The next day, a police officer refers Jordan. He was found in another town with older men, a new phone
        and cash. The officer chose the concern type, extra-familial harm, and gave his NHS number.

    - title: Acknowledged
      label: Response
      route: "#/record/response/RES-2026-1131"
      task: Select what this responds to.
      trace: /respondsTo
      text: >
        The front door acknowledges the referral the next morning. The response points back at the referral
        by its identifier.

    - title: A section 47 enquiry
      label: Section 47
      route: "#/record/request/REQ-2026-0322"
      task: Select the referral this follows up.
      trace: /linkedRecord/0
      text: >
        The front door asks the assessment team to start a section 47 enquiry. The request follows up the
        police referral.

    - title: The enquiry begins
      label: Enquiry
      route: "#/record/episode/EP-2026-0129"
      task: Select the request this follows up.
      trace: /linkedRecord/0
      text: >
        Jordan's social worker opens the enquiry, following up the request. Persistent school absence is
        recorded as a coded observation, in a form any system can read.
